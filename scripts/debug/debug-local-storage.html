<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地存储调试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .section h2 {
            margin-top: 0;
            color: #555;
        }
        .data {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .button:hover {
            background-color: #45a049;
        }
        .button.danger {
            background-color: #f44336;
        }
        .button.danger:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>本地存储调试工具</h1>
        
        <div class="section">
            <h2>存储内容</h2>
            <button class="button" onclick="showStorage()">查看存储</button>
            <button class="button danger" onclick="clearStorage()">清除存储</button>
            <div id="storageContent" class="data"></div>
        </div>
        
        <div class="section">
            <h2>导入测试</h2>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
            <button class="button" onclick="testImport()">测试导入</button>
            <div id="importResult" class="data"></div>
        </div>
    </div>
    
    <script>
        // 模拟 SheetJS
        function showStorage() {
            const categories = localStorage.getItem('quizCategories');
            const questions = localStorage.getItem('quizQuestions');
            
            let content = '';
            if (categories) {
                content += '=== 分类 ===\n';
                const cats = JSON.parse(categories);
                content += `分类数量: ${cats.length}\n`;
                cats.forEach(cat => {
                    content += `- ${cat.name} (${cat.id})\n`;
                });
            } else {
                content += '=== 分类 ===\n无\n';
            }
            
            content += '\n';
            
            if (questions) {
                content += '=== 题目 ===\n';
                const qs = JSON.parse(questions);
                content += `分类数量: ${Object.keys(qs).length}\n`;
                Object.entries(qs).forEach(([categoryId, questions]) => {
                    content += `- 分类 ${categoryId}: ${questions.length} 题\n`;
                });
            } else {
                content += '=== 题目 ===\n无\n';
            }
            
            document.getElementById('storageContent').textContent = content;
        }
        
        function clearStorage() {
            if (confirm('确定要清除所有本地存储数据吗？')) {
                localStorage.clear();
                showStorage();
                alert('存储已清除');
            }
        }
        
        function testImport() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('请选择一个Excel文件');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    // 这里只是模拟，实际解析需要 SheetJS
                    document.getElementById('importResult').textContent = '文件读取成功，大小: ' + file.size + ' bytes';
                } catch (error) {
                    document.getElementById('importResult').textContent = '错误: ' + error.message;
                }
            };
            reader.readAsArrayBuffer(file);
        }
        
        // 初始显示
        showStorage();
    </script>
</body>
</html>
